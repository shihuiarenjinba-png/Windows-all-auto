name: Local Partner Center operator contract (no browser)

on:
  push:
    branches:
      - codex/local-partner-center-operator-gate-20261028
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-only:
    name: Contract-only / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source-only operator worker
        run: python -m py_compile scripts/local_partner_center_operator.py
      - name: Test exact-source gate and Identity schema without Partner Center access
        run: python -m unittest discover -s tests -p test_local_partner_center_operator.py -v
