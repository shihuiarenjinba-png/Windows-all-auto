name: GitHub artifact custody fail-closed regression
on:
  pull_request:
    paths:
      - 'scripts/github_artifact_custody.py'
      - 'scripts/local_handoff_pull.py'
      - 'tests/test_github_artifact_custody.py'
      - 'tests/test_local_handoff_pull.py'
      - 'tests/test_github_artifact_redirect_security.py'
      - '.github/workflows/e2e-artifact-custody.yml'
  workflow_dispatch:
jobs:
  custody-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent artifact custody and local-pull regressions
        run: |
          python -m unittest discover -s tests -p 'test_github_artifact_custody.py' -v
          python -m unittest discover -s tests -p 'test_local_handoff_pull.py' -v
          python -m unittest discover -s tests -p 'test_github_artifact_redirect_security.py' -v
