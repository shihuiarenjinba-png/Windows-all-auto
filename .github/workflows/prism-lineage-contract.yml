name: Prism post-Identity lineage contract

on:
  push:
    branches:
      - codex/prism-post-identity-lineage-audit-20261028
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lineage-contract:
    name: Read-only contract / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile read-only lineage auditor
        run: python -m py_compile scripts/prism_identity_lineage_audit.py
      - name: Test post-Identity candidate fail-closed contract
        run: python -m unittest discover -s tests -p test_prism_identity_lineage_audit.py -v
