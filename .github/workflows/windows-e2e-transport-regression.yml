name: Windows E2E transport fail-closed regression
on:
  pull_request:
    paths:
      - 'tests/test_real_msix_transport_failclosed.py'
      - 'scripts/github_artifact_custody.py'
      - 'scripts/local_handoff_pull.py'
      - 'scripts/local_checker_queue.py'
      - 'tests/test_github_artifact_custody.py'
      - 'tests/test_local_handoff_pull.py'
      - 'tests/test_local_checker_queue.py'
      - 'tests/test_github_artifact_redirect_security.py'
      - '.github/workflows/e2e-artifact-custody.yml'
      - '.github/workflows/windows-e2e-transport-regression.yml'
  workflow_dispatch:
jobs:
  transport-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed transport and checker handoff regression
        run: |
          python -m unittest discover -s tests -p 'test_real_msix_transport_failclosed.py' -v
          python -m unittest discover -s tests -p 'test_local_checker_queue.py' -v
