name: Windows E2E transport fail-closed regression
on:
  pull_request:
    paths:
      - 'tests/test_real_msix_transport_failclosed.py'
      - '.github/workflows/windows-e2e-transport-regression.yml'
  workflow_dispatch:
jobs:
  transport-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed transport regression
        run: python -m unittest discover -s tests -p 'test_real_msix_transport_failclosed.py' -v
