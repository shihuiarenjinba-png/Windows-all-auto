name: Factory bridge regression checks (MCP orchestrated)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/windows-all-auto-integration-20261026
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm latest Factory bridge checks
        run: |
          python -m compileall -q all_auto scripts tests
          python -m unittest discover -s tests -v
      - name: Explain automation responsibilities
        run: |
          echo "The four ChatGPT 15-minute-spaced scheduled agent tasks use GitHub MCP to inspect, reason and update work branches."
          echo "This GitHub workflow runs deterministic checks only, without OpenAI API keys."
          echo "Factory MSIX transport remains in its separate GitHub Actions workflow."
